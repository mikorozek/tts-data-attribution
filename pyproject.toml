[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tts-data-attribution"
version = "0.1.0"
description = "Reusable TrackStar/LDS data-attribution experiment framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Research code license TBD" }
dependencies = ["numpy>=1.26", "torch>=2.0"]

[dependency-groups]
data = ["gdown==6.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/tts_data_attribution"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
