[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tts-data-attribution"
version = "0.1.0"
description = "Reusable TrackStar/LDS data-attribution experiment framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Research code license TBD" }
dependencies = ["numpy>=1.26", "torch>=2.0"]

[project.scripts]
tda = "tts_data_attribution.cli.main:main"

[dependency-groups]
qwen = ["qwen-tts"]

[tool.uv.sources]
qwen-tts = { path = "third_party/Qwen3-TTS", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/tts_data_attribution"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
