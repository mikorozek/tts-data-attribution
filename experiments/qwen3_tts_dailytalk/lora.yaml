schema_version: 1
status: preliminary

# LoRA targets are resolved from the loaded model at runtime. This file may be
# copied to define narrower or broader adapter-placement experiments without
# changing Python source code.
targeting:
  allowed_components:
    - generative_transformer_core
  module_types:
    - linear
  include_name_patterns:
    - "*"
  exclude_name_patterns: []

hyperparameters:
  rank: null       # Select after the architecture audit and feasibility pilot.
  alpha: null
  dropout: null
  bias: none

validation:
  fail_if_no_targets: true
  fail_on_unmatched_patterns: true
  forbid_frozen_component_matches: true
  frozen_components:
    - speech_tokenizer
    - reference_speaker_encoder
  write_resolved_manifest: true
  require_finite_nonzero_gradients: true
